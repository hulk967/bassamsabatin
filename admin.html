<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة إدارة الموقع | Bassam Sabatin Woodworks</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="admin-page">
  <main class="admin-shell">
    <section id="loginBox" class="admin-login-card">
      <img src="assets/logo.png" alt="Bassam Sabatin" class="admin-login-logo">
      <h1>لوحة إدارة الموقع</h1>
      <p>ادخل الإيميل والباسورد الخاصين بالأدمن.</p>
      <form id="loginForm" class="admin-login-form">
        <input id="loginEmail" type="email" placeholder="Email" required>
        <input id="loginPassword" type="password" placeholder="Password" required>
        <button type="submit">دخول</button>
      </form>
      <p id="loginError" class="admin-error"></p>
      <a href="index.html" class="admin-back-link">الرجوع للموقع</a>
    </section>

    <section id="dashboard" class="admin-full-dashboard hidden">
      <header class="admin-full-top">
        <div>
          <h1>لوحة إدارة Bassam Sabatin Woodworks</h1>
          <p>عدّل محتوى الموقع واحفظ مباشرة في Supabase.</p>
        </div>
        <div class="admin-top-actions">
          <a href="index.html" target="_blank">فتح الموقع</a>
          <button id="logoutBtn">تسجيل خروج</button>
        </div>
      </header>

      <nav class="admin-tabs">
        <button class="active" data-tab="settings">إعدادات الموقع</button>
        <button data-tab="projects">المشاريع</button>
        <button data-tab="services">الخدمات</button>
        <button data-tab="materials">الخامات</button>
      </nav>

      <section class="admin-tab-panel active" id="tab-settings">
        <h2>إعدادات عامة</h2>
        <div class="admin-form-grid">
          <label>اللوجو<input id="setLogo" placeholder="assets/logo.png"></label>
          <label>فيديو الخلفية<input id="setHeroVideo" placeholder="assets/media/hero-wood.mp4"></label>
          <label>Poster الفيديو<input id="setHeroPoster" placeholder="assets/projects/project-1.png"></label>
          <label>رقم الواتساب<input id="setWhatsapp" placeholder="962798234541"></label>
          <label>Hero Eyebrow<input id="setHeroEyebrow"></label>
          <label class="full">عنوان الهيرو<textarea id="setHeroTitle"></textarea></label>
          <label class="full">وصف الهيرو<textarea id="setHeroLead"></textarea></label>
          <label>عنوان من نحن<input id="setAboutTitle"></label>
          <label>وصف صغير من نحن<input id="setAboutLead"></label>
          <label class="full">نص من نحن 1<textarea id="setAboutText1"></textarea></label>
          <label class="full">نص من نحن 2<textarea id="setAboutText2"></textarea></label>
          <label>عنوان الخدمات<input id="setServicesTitle"></label>
          <label>عنوان الأعمال<input id="setPortfolioTitle"></label>
          <label class="full">عنوان التواصل<textarea id="setContactTitle"></textarea></label>
          <label class="full">وصف التواصل<textarea id="setContactLead"></textarea></label>
          <label>رفع لوجو جديد<input id="uploadLogo" type="file" accept="image/*"></label>
          <label>رفع فيديو Hero جديد<input id="uploadHeroVideo" type="file" accept="video/mp4,video/webm"></label>
        </div>
        <button id="saveSettings" class="admin-primary">حفظ الإعدادات</button>
      </section>

      <section class="admin-tab-panel" id="tab-projects">
        <div class="admin-split-head"><h2>المشاريع</h2><button id="newProject" class="admin-primary">+ مشروع جديد</button></div>
        <div class="admin-editor-layout">
          <div id="projectList" class="admin-side-list"></div>
          <form id="projectForm" class="admin-edit-form">
            <input type="hidden" id="projectId">
            <label>اسم المشروع<input id="projectName" required></label>
            <label>التصنيف<input id="projectCat"></label>
            <label>الخشب<input id="projectWood"></label>
            <label>التشطيب<input id="projectFinish"></label>
            <label>المدة<input id="projectDuration"></label>
            <label class="full">الصورة الرئيسية<input id="projectImage"></label>
            <label class="full">وصف الكرت<textarea id="projectDescription"></textarea></label>
            <label class="full">تفاصيل المشروع<textarea id="projectDetails"></textarea></label>
            <label class="full">معرض الصور - كل رابط بسطر<textarea id="projectGallery"></textarea></label>
            <label class="full">الفيديوهات - كل رابط بسطر<textarea id="projectVideos"></textarea></label>
            <label class="full">رفع صور/فيديو للمشروع<input id="projectFiles" type="file" multiple accept="image/*,video/mp4,video/webm"><div id="projectUploadPreview" class="admin-upload-preview"></div></label>
            <div class="admin-row-actions full"><button type="submit" class="admin-primary">حفظ المشروع</button><button type="button" id="deleteProject" class="admin-danger">حذف</button></div>
          </form>
        </div>
      </section>

      <section class="admin-tab-panel" id="tab-services">
        <div class="admin-split-head"><h2>الخدمات</h2><button id="newService" class="admin-primary">+ خدمة جديدة</button></div>
        <div class="admin-editor-layout"><div id="serviceList" class="admin-side-list"></div><form id="serviceForm" class="admin-edit-form"><input type="hidden" id="serviceId"><label>العنوان<input id="serviceTitle" required></label><label class="full">الوصف<textarea id="serviceDescription"></textarea></label><div class="admin-row-actions full"><button class="admin-primary">حفظ</button><button type="button" id="deleteService" class="admin-danger">حذف</button></div></form></div>
      </section>

      <section class="admin-tab-panel" id="tab-materials">
        <div class="admin-split-head"><h2>الخامات</h2><button id="newMaterial" class="admin-primary">+ خامة جديدة</button></div>
        <div class="admin-editor-layout"><div id="materialList" class="admin-side-list"></div><form id="materialForm" class="admin-edit-form"><input type="hidden" id="materialId"><label>العنوان<input id="materialTitle" required></label><label class="full">الوصف<textarea id="materialDescription"></textarea></label><div class="admin-row-actions full"><button class="admin-primary">حفظ</button><button type="button" id="deleteMaterial" class="admin-danger">حذف</button></div></form></div>
      </section>

      <p id="adminStatus" class="admin-status"></p>
    </section>
  </main>
  <script type="module" src="admin.js"></script>
</body>
</html>
